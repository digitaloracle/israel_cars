<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israel Vehicle Lookup</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Israel Vehicle Lookup</h1>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <label for="license-plate">License Plate:</label>
      <div class="search-row">
        <input
          type="text"
          id="license-plate"
          placeholder="e.g., 22821202"
          maxlength="10"
          autocomplete="off"
        >
        <button id="search-btn" type="button">Search</button>
      </div>
    </section>

    <!-- Dealer Filter Section -->
    <section class="filter-section">
      <button id="dealer-filter-btn" type="button" class="dealer-filter-btn">
        <span class="filter-icon">&#x2691;</span>
        <span id="dealer-filter-label">Hide dealer ads</span>
      </button>
    </section>

    <!-- Image OCR Section -->
    <section class="image-section">
      <button id="select-region-btn" type="button" class="select-region-btn">
        Select region from page
        <span class="experimental-badge">experimental</span>
      </button>
    </section>

    <!-- OCR Status -->
    <div class="ocr-status" id="ocr-status" style="display: none;">
      <div class="ocr-progress-bar">
        <div class="ocr-progress-fill" id="ocr-progress-fill"></div>
      </div>
      <span id="ocr-status-text">Loading OCR model...</span>
    </div>

    <!-- Recent Searches -->
    <section class="recent-section" id="recent-section" style="display: none;">
      <label>Recent:</label>
      <div class="recent-list" id="recent-list"></div>
    </section>

    <!-- Loading Indicator -->
    <div class="loading" id="loading" style="display: none;">
      <div class="spinner"></div>
      <span>Querying vehicle database...</span>
    </div>

    <!-- Error Panel -->
    <div class="panel error-panel" id="error-panel" style="display: none;">
      <div class="panel-title">Error</div>
      <div class="panel-content" id="error-message"></div>
    </div>

    <!-- Not Found Panel -->
    <div class="panel warning-panel" id="not-found-panel" style="display: none;">
      <div class="panel-title">Not Found</div>
      <div class="panel-content" id="not-found-message"></div>
    </div>

    <!-- Results Section -->
    <section class="results-section" id="results-section" style="display: none;">

      <!-- Vehicle Details Table -->
      <div class="table-container">
        <h2 class="table-title">Vehicle Registration Details</h2>
        <table class="data-table" id="vehicle-table">
          <thead>
            <tr>
              <th>Field</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="vehicle-tbody">
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Mileage Loading -->
      <div class="loading-inline" id="mileage-loading" style="display: none;">
        <div class="spinner-small"></div>
        <span>Fetching mileage data...</span>
      </div>

      <!-- Ownership History Table -->
      <div class="table-container" id="history-container" style="display: none;">
        <h2 class="table-title">Ownership History Timeline</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Period Start</th>
              <th>Period End</th>
              <th>Owner Type</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- History Loading -->
      <div class="loading-inline" id="history-loading" style="display: none;">
        <div class="spinner-small"></div>
        <span>Fetching ownership history...</span>
      </div>

      <!-- Price Depreciation Section -->
      <div class="table-container" id="price-container" style="display: none;">
        <h2 class="table-title">Price Depreciation</h2>
        <div class="price-summary" id="price-summary"></div>
        <div class="dep-chart" id="price-chart"></div>
      </div>

    </section>
  </div>

  <script src="../utils/api-cache.js"></script>
  <script src="../utils/fetch-utils.js"></script>
  <script src="../utils/price-utils.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
